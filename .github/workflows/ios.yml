name: iOS Sakulala Demo Mobile Sample App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'android/**'
      - '**.md'
      - '**/android.yml'

defaults:
  run:
    working-directory: ios

# ─────────────────────────────────────────────────────────────────────────────
# Environment variables shared across all jobs
# Format: v{app_version}-build.{run_number}-{short_sha}
# Example: v3.0.0-build.42-abc1d2e
# ─────────────────────────────────────────────────────────────────────────────
env:
  APP_VERSION: "3.0.0"

jobs:
  SimulatorRelease:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set short Git SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | head -c 7)" >> $GITHUB_ENV

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          yarn install --ignore-engines --ignore-scripts
          echo "Mocking pod install for demo..."

      - name: Static Analysis (ESLint, Prettier, tsc)
        run: |
          yarn lint
          yarn format
          yarn typecheck

      - name: Unit Tests (Jest)
        run: yarn test

      - name: Build iOS Sim Build (Fastlane Mock)
        run: echo "Mocking iOS release build..." && mkdir -p ios/build && touch ios/build/app.app

      - name: E2E Automation Testing (Appium)
        run: echo "Running Appium E2E scripts against iOS Simulator..."
        # When running on Mac Mini, replace with: yarn ios.test.local.sim

      - name: Distribute to Firebase App Distribution / TestFlight
        run: echo "Uploading to Firebase via Fastlane..."

      - name: Archive App
        uses: actions/upload-artifact@v4
        with:
          # Naming convention: iOS-Sakulala-v{version}-build.{number}-{short_sha}-simulator
          name: iOS-Sakulala-v${{ env.APP_VERSION }}-build.${{ github.run_number }}-${{ env.SHORT_SHA }}-simulator
          path: '**/build/app.app'
          retention-days: 30

