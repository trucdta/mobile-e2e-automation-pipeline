name: iOS SauceLabs Mobile Sample App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'android/**'
      - '**.md'
      - '**/android.yml'
defaults:
  run:
    working-directory: ios
jobs:
  SimulatorRelease:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          yarn install
          yarn ios.pods
      - name: Static Analysis (ESLint, Prettier, tsc)
        run: |
          yarn lint
          yarn format
          yarn typecheck
      - name: Unit Tests (Jest)
        run: yarn test
      - name: Build iOS Sim Build (Fastlane Mock)
        run: yarn ios.release.sim.build
      - name: E2E Automation Testing (Appium)
        run: echo "Running Appium E2E scripts against iOS Simulator..."
      - name: Distribute to Firebase App Distribution / TestFlight
        run: echo "Uploading to Firebase via Fastlane..."
      - name: Archive App
        uses: actions/upload-artifact@v3
        with:
          name: iOS SauceLabs Sample App Sim Build
          path: '**/Build/Products/Release-iphonesimulator/SwagLabsMobileApp.app'
