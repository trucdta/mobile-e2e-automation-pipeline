name: Android SauceLabs Sample App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ios/**'
      - '**.md'
      - '**/ios.yml'
defaults:
  run:
    working-directory: android
jobs:
  EspressoBuild:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: yarn install
      - name: Static Analysis (ESLint, Prettier, tsc)
        run: |
          yarn lint
          yarn format
          yarn typecheck
      - name: Unit Tests (Jest)
        run: yarn test
      - name: Build Android Espresso Debug Build (Fastlane Mock)
        run: yarn android.espresso
      - name: E2E Automation Testing (Appium)
        run: echo "Running Appium E2E scripts against Android Emulator..."
      - name: Distribute to Firebase App Distribution / Google Play
        run: echo "Uploading to Firebase via Fastlane..."
      - name: Archive Apps
        uses: actions/upload-artifact@v3
        with:
          name: Android SauceLabs Sample App Espresso Tests
          path: '**/app/build/outputs/apk/**/*.apk'
  ReleaseBuild:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: yarn install
      - name: Build Android Release (Fastlane)
        run: yarn android.release
      - name: Distribute to Google Play (Fastlane)
        run: echo "Uploading AAB to Google Play Console..."
      - name: Archive Apps
        uses: actions/upload-artifact@v3
        with:
          name: Android SauceLabs Sample App Release
          path: '**/app/build/outputs/apk/release/**/*.apk'
