name: Android Sakulala Demo Sample App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ios/**'
      - '**.md'
      - '**/ios.yml'

defaults:
  run:
    working-directory: android

# ─────────────────────────────────────────────────────────────────────────────
# Environment variables shared across all jobs
# Format: v{app_version}-build.{run_number}-{short_sha}
# Example: v3.0.0-build.42-abc1d2e
# ─────────────────────────────────────────────────────────────────────────────
env:
  APP_VERSION: "3.0.0"

jobs:
  EspressoBuild:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set short Git SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | head -c 7)" >> $GITHUB_ENV

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Java 8
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Install dependencies
        run: yarn install --ignore-engines --ignore-scripts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Static Analysis (ESLint, Prettier, tsc)
        run: |
          yarn lint
          yarn format
          yarn typecheck

      - name: Unit Tests (Jest)
        run: yarn test

      - name: Build Android Espresso Debug Build
        run: yarn android.espresso

      - name: E2E Automation Testing (Appium)
        run: echo "Running Appium E2E scripts against Android Emulator..."
        # When running on Mac Mini, replace with: yarn android.test.local.emu

      - name: Distribute to Firebase App Distribution / Google Play
        run: echo "Uploading to Firebase via Fastlane..."

      - name: Archive Apps
        uses: actions/upload-artifact@v4
        with:
          # Naming convention: Android-Sakulala-v{version}-build.{number}-{short_sha}-espresso
          name: Android-Sakulala-v${{ env.APP_VERSION }}-build.${{ github.run_number }}-${{ env.SHORT_SHA }}-espresso
          path: '**/app/build/outputs/apk/**/*.apk'
          retention-days: 30

  ReleaseBuild:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set short Git SHA
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
        working-directory: .

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Install dependencies
        run: yarn install --ignore-engines --ignore-scripts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release Build
        run: yarn android.release

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: demo-team
          file: android/app/build/outputs/apk/release/app-release.apk

      - name: Distribute to Google Play (Fastlane)
        run: echo "Uploading AAB to Google Play Console..."

      - name: Archive Apps
        uses: actions/upload-artifact@v4
        with:
          # Naming convention: Android-Sakulala-v{version}-build.{number}-{short_sha}-release
          name: Android-Sakulala-v${{ env.APP_VERSION }}-build.${{ github.run_number }}-${{ env.SHORT_SHA }}-release
          path: '**/app/build/outputs/apk/release/**/*.apk'
          retention-days: 30
